# Server
server.port=8080

# MongoDB
spring.data.mongodb.uri=mongodb://localhost:27017/skillbridge
spring.data.mongodb.database=skillbridge

# JWT
jwt.secret=SkillBridgeSecretKey2024VeryLongSecretKeyForJWTTokenGeneration
jwt.expiration=86400000

# CORS
spring.web.cors.allowed-origins=http://localhost:5173
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*

# App
spring.application.name=skillbridge
