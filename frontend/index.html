<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SkillBridge - Remote Job Portal</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Bootstrap Icons — loaded non-blocking so it doesn't delay first paint -->
    <link rel="preload" as="style"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      onload="this.onload=null;this.rel='stylesheet'" />
    <noscript>
      <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    </noscript>

    <!-- Google Fonts: Inter (body) + Lora (serif headings) — non-blocking load -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lora:wght@500;600;700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'" />
    <noscript>
      <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lora:wght@500;600;700&display=swap" />
    </noscript>
    <meta name="description" content="SkillBridge - Remote Job Portal with Verified Skill Tagging. CDAC Project PGCP-AC-002" />

    <!-- SEO + Social sharing (Open Graph / Twitter) -->
    <meta name="theme-color" content="#0A2347" />
    <meta name="keywords" content="remote jobs, job portal, skill matching, verified skills, hiring, SkillBridge" />
    <meta name="author" content="SkillBridge Team - CDAC PGCP-AC-002" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SkillBridge" />
    <meta property="og:title" content="SkillBridge — Remote Job Portal with Verified Skill Tagging" />
    <meta property="og:description" content="Find remote jobs that match your skills. Admin-verified skill badges, skill-match scores, and a complete hiring pipeline." />
    <meta property="og:url" content="https://cdacb-skillbridge.vercel.app/" />
    <meta property="og:image" content="https://cdacb-skillbridge.vercel.app/logo.svg" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="SkillBridge — Remote Job Portal" />
    <meta name="twitter:description" content="Find remote jobs that match your skills. Verified skill badges and skill-match scores." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
